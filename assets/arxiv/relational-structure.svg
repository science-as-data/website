<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
  <title id="title">arXiv PostgreSQL database: bulk sources connected to Kaggle metadata</title>
  <desc id="desc">Two schemas in one database. In arxiv_source, one ingestion batch has many paper records; each record has many source-file occurrences. A file optionally references one deduplicated text content. Paper records optionally join to one arxiv.papers metadata row by exact arXiv ID. Each paper has many ordered author occurrences, category assignments, and submission versions, and at most one selected raw metadata record. The cross-schema join is not a foreign key. Supporting provenance tables are documented in the accompanying table inventory.</desc>
  <style>
    text{fill:#25323b;font-family:Arial,sans-serif;font-size:15px}
    .heading{font-size:19px;font-weight:700}.sub{fill:#54615f;font-size:14px}
    .table{font-family:monospace;font-size:18px;font-weight:700}
    .field{font-family:monospace;font-size:14px}.key{fill:#496956;font-size:13px;font-weight:700}
    .edge{fill:none;stroke:#62746a;stroke-width:1.7}.optional{stroke:#a4613e;stroke-dasharray:6 5}
    .box{fill:white;stroke:#afbeac}.rule{stroke:#d6dfd0}.count{font-size:13px;fill:#496956;font-weight:700}
  </style>
  <rect width="1100" height="740" fill="#fafbf5"/>
  <rect x="20" y="20" width="505" height="662" rx="4" fill="#eef2e7"/>
  <rect x="565" y="20" width="515" height="662" rx="4" fill="#f4f1e9"/>
  <text x="45" y="51" class="heading">arxiv_source · curated bulk sources</text>
  <text x="590" y="51" class="heading">arxiv · Kaggle metadata catalogue</text>

  <path class="edge" d="M272 167V222M272 334V386M272 498V552"/>
  <text x="284" y="183" class="count">1</text><text x="284" y="214" class="count">N</text>
  <text x="303" y="201" class="field">batch_id</text>
  <text x="284" y="350" class="count">1</text><text x="284" y="378" class="count">N</text>
  <text x="303" y="367" class="field">record_id</text>
  <text x="284" y="514" class="count">N</text><text x="284" y="544" class="count">0..1</text>
  <text x="326" y="532" class="field">content_sha256</text>

  <rect class="box" x="45" y="85" width="455" height="82" rx="3"/>
  <text x="62" y="112" class="table">ingestion_batches</text><path class="rule" d="M45 125H500"/>
  <text x="62" y="149" class="field">PK batch_id · input hash · parser fingerprint</text>

  <rect class="box" x="45" y="222" width="455" height="112" rx="3"/>
  <text x="62" y="249" class="table">paper_records</text><path class="rule" d="M45 262H500"/>
  <text x="62" y="287" class="field">PK record_id · FK batch_id</text>
  <text x="62" y="312" class="field">arxiv_id · article_version? · status · hashes</text>

  <rect class="box" x="45" y="386" width="455" height="112" rx="3"/>
  <text x="62" y="413" class="table">source_files</text><path class="rule" d="M45 426H500"/>
  <text x="62" y="451" class="field">PK (record_id, file_number)</text>
  <text x="62" y="476" class="field">path · retention · FK content_sha256?</text>

  <rect class="box" x="45" y="552" width="455" height="104" rx="3"/>
  <text x="62" y="579" class="table">text_contents</text><path class="rule" d="M45 592H500"/>
  <text x="62" y="617" class="field">PK content_sha256 · decoding · byte size</text>
  <text x="62" y="641" class="sub">Stored TeX, BibTeX, .bbl and supporting text</text>

  <path class="edge optional" d="M500 278H650"/>
  <text x="513" y="263" class="field">arxiv_id</text>
  <text x="507" y="298" class="count">N</text><text x="612" y="298" class="count">0..1</text>
  <text x="516" y="319" class="sub">exact-ID join</text>

  <path class="edge" d="M698 150V184H756V222M942 150V184H963V222M756 334V367H698V422M963 334V367H942V422"/>
  <text x="708" y="168" class="count">N</text><text x="768" y="211" class="count">1</text>
  <text x="953" y="168" class="count">N</text><text x="975" y="211" class="count">1</text>
  <text x="768" y="352" class="count">1</text><text x="708" y="411" class="count">N</text>
  <text x="975" y="352" class="count">1</text><text x="953" y="411" class="count">0..1</text>

  <rect class="box" x="650" y="222" width="405" height="112" rx="3"/>
  <text x="667" y="249" class="table">papers</text><path class="rule" d="M650 262H1055"/>
  <text x="667" y="287" class="field">PK arxiv_id · FK ingestion_run_id</text>
  <text x="667" y="312" class="sub">Title · abstract · DOI · license · dates</text>

  <rect class="box" x="590" y="70" width="215" height="80" rx="3"/>
  <text x="602" y="97" class="table">paper_authors</text>
  <text x="602" y="120" class="key">PK arxiv_id + author_position</text>
  <text x="602" y="140" class="sub">Ordered name occurrences</text>
  <rect class="box" x="830" y="70" width="225" height="80" rx="3"/>
  <text x="842" y="97" class="table">paper_categories</text>
  <text x="842" y="120" class="key">PK arxiv_id + category_position</text>
  <text x="842" y="140" class="sub">Subject assignments</text>
  <rect class="box" x="590" y="422" width="215" height="85" rx="3"/>
  <text x="602" y="449" class="table">paper_versions</text>
  <text x="602" y="474" class="key">PK arxiv_id + version</text>
  <text x="602" y="495" class="sub">Submission timestamps</text>
  <rect class="box" x="830" y="422" width="225" height="85" rx="3"/>
  <text x="842" y="449" class="table">raw_records</text>
  <text x="842" y="474" class="key">PK arxiv_id</text>
  <text x="842" y="495" class="sub">Selected source JSON values</text>
  <text x="650" y="540" class="sub">All metadata children join on arxiv_id.</text>
  <rect x="590" y="568" width="465" height="88" fill="#ebe8de" rx="3"/>
  <text x="607" y="594" class="field">ingestion_runs · duplicate_records</text>
  <text x="607" y="618" class="sub">Metadata load provenance and repeated-ID evidence.</text>
  <text x="607" y="641" class="sub">Source provenance: see the complete table inventory.</text>

  <path class="edge" d="M45 713H85"/><text x="96" y="718" class="sub">Foreign key</text>
  <path class="edge optional" d="M235 713H275"/><text x="286" y="718" class="sub">Optional metadata join</text>
  <text x="510" y="718" class="sub">N = zero or many · ? = nullable · PK = primary key · FK = foreign key</text>
</svg>
